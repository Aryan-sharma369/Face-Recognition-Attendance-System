<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Student | FaceID Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-6">

    <div class="max-w-md w-full bg-white rounded-[2.5rem] shadow-2xl border border-slate-200 overflow-hidden">
        <div class="p-8 bg-indigo-600 text-white text-center">
            <div class="bg-white/20 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 backdrop-blur-md">
                <i class="fas fa-user-plus text-2xl"></i>
            </div>
            <h2 class="text-2xl font-black tracking-tight">New Enrollment</h2>
            <p class="text-indigo-100 text-sm font-medium mt-1">Register a face for AI recognition</p>
        </div>

        <div class="p-8">
            {% if success %}
            <div class="bg-green-50 border border-green-200 text-green-700 p-4 rounded-2xl mb-6 flex items-center gap-3 animate-bounce">
                <i class="fas fa-check-circle"></i>
                <span class="text-sm font-bold">Student Registered Successfully!</span>
            </div>
            {% endif %}

            <form action="/register" method="POST" enctype="multipart/form-data" class="space-y-5">
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1 ml-1">Full Name</label>
                    <input type="text" name="name" required placeholder="e.g. Aryan Sharma" 
                           class="w-full bg-slate-50 border border-slate-200 p-4 rounded-2xl focus:ring-2 focus:ring-indigo-500 outline-none transition font-semibold">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1 ml-1">Roll Number</label>
                        <input type="text" name="roll_number" placeholder="2024-CSE-01" 
                               class="w-full bg-slate-50 border border-slate-200 p-4 rounded-2xl focus:ring-2 focus:ring-indigo-500 outline-none transition font-semibold text-sm">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1 ml-1">Parent Email</label>
                        <input type="email" name="email" required placeholder="parent@mail.com" 
                               class="w-full bg-slate-50 border border-slate-200 p-4 rounded-2xl focus:ring-2 focus:ring-indigo-500 outline-none transition font-semibold text-sm">
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1 ml-1">Student Photo (.jpg only)</label>
                    <div class="mt-1 flex justify-center px-6 pt-5 pb-6 border-2 border-slate-200 border-dashed rounded-2xl hover:border-indigo-400 transition cursor-pointer bg-slate-50">
                        <div class="space-y-1 text-center">
                            <i class="fas fa-cloud-upload-alt text-slate-300 text-3xl mb-2"></i>
                            <div class="flex text-sm text-slate-600">
                                <label class="relative cursor-pointer bg-white rounded-md font-bold text-indigo-600 hover:text-indigo-500 focus-within:outline-none">
                                    <span>Select Image</span>
                                    <input type="file" name="image" accept="image/*" required class="sr-only">
                                </label>
                            </div>
                        </div>
                    </div>
                </div>

                <button type="submit" class="w-full bg-slate-900 text-white p-5 rounded-2xl font-black text-sm uppercase tracking-widest hover:bg-indigo-600 shadow-xl transition-all transform hover:-translate-y-1">
                    Complete Registration
                </button>
            </form>

            <a href="/" class="block text-center mt-8 text-slate-400 hover:text-indigo-600 text-[10px] font-black uppercase tracking-widest transition">
                <i class="fas fa-arrow-left mr-2"></i> Back to Dashboard
            </a>
        </div>
    </div>

</body>
</html>
